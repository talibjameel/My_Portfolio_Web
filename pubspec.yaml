name: portfolio_web
description: "portfolio_web"

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  url_launcher: ^6.3.2
  font_awesome_flutter: ^10.9.1
  flutter_svg: ^2.2.1
  flutter_launcher_icons: ^0.14.4



dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/res/
    - assets/icons/
    - assets/illustrations/


flutter_launcher_icons:
  web:
    generate: true
    image_path: assets/Favicon.png